<!DOCTYPE html>
<head>
<title>Random Quiz</title>
<style>
 .bg{
          background-image: url("Plus.jpg");
          background-repeat: no-repeat;
          background-size: cover;
            }
            .questionbox {
        position: relative;
        background-color:rgb(221, 229, 230);
        border: 3px;
        border-style: solid;
        border-color: rgb(107, 242, 147);
        padding: 10px;
        margin-right: 540px;
        margin-left: 540px;
        margin-top: 120px;
        height: 420px;
      }
      #bottom-left {
        left: 0;
        bottom: 0;
        position: absolute;
      }
</style>
</head>
  <center>
<div class="questionbox">
<body text="black" link="red" vlink="purple" alink="blue" bgcolor="white" div class="bg">
  <h4>Welcome to my game!</h4>
<div>
 <h2 id="test_status">Math Quiz</h2>
 <h3 id="timeleft">Time left</h3>
</div>
<div id="test"></div>
</div>
  <image id="bottom-left" src="Images/Pi.png">
<script>
var myVar;
function startTimer() {
  myVar = setInterval(function(){myTimer()},1000);
  timelimit = maxtimelimit;
}
function myTimer() {
  if (timelimit > 0) {
    curmin=Math.floor(timelimit/60);
    cursec=timelimit%60;
    if (curmin!=0) { curtime=curmin+" minutes and "+cursec+" seconds left"; }
              else { curtime=cursec+" seconds left"; }
    $_('timeleft').innerHTML = curtime;
  } else {
    $_('timeleft').innerHTML = timelimit+' - Out of Time - no credit given for answer';
    clearInterval(myVar);
  }
  timelimit--;
}

// Modified from: http://www.webdeveloper.com/forum/showthread.php?304231-HTML-Random-Quiz-Game-w-Timer

var pos = 0, posn, choice, correct = 0, rscore = 0;
var maxtimelimit = 20, timelimit = maxtimelimit;  // 20 seconds per question

var questions = [
    [ "What is 9 - 3?", "6", "5", "16", "7", "A" ],
    [ "What is 20 - 9?", "7", "13", "11", "12", "C" ],
    [ "What is 7 + 3?", "11", "10", "13", "15", "B" ],
    [ "What is 8 - 2?", "6", "2", "4", "5", "A" ],
    [ "What is 8 + 12?", "8", "12", "20", "14", "C" ],
    [ "What is 8 + 2?", "10", "9", "11", "14", "A" ],
    [ "What is 6 + 4 + 2?", "12", "14", "16", "17", "A" ],
    [ "What is 20 - 7?", "7", "13", "11", "6", "B" ],
    [ "What is 5 - 5?", "5", "1", "0", "2", "C" ],
    [ "What is 8 + 4?", "10", "12", "4", "3", "B" ]
];
var questionOrder = [];
function setQuestionOrder() {
  questionOrder.length = 0;
  for (var i=0; i<questions.length; i++) { questionOrder.push(i); }
  questionOrder.sort(randOrd);   // alert(questionOrder);  // shuffle display order
  pos = 0;  posn = questionOrder[pos];
}

function $_(IDS) { return document.getElementById(IDS); }
function randOrd() { return (Math.round(Math.random())-0.5); }
function renderResults(){
  var test = $_("test");
  test.innerHTML = "<h2>You got "+correct+" of "+questions.length+" questions correct</h2>";
  $_("test_status").innerHTML = "Test Completed";
  $_('timeleft').innerHTML = '';
  test.innerHTML += '<button onclick="location.reload()">Re-test</a> ';
  setQuestionOrder();
  correct = 0;
  clearInterval(myVar);
  return false;
}
function renderQuestion() {
  var test = $_("test");
  $_("test_status").innerHTML = "Question "+(pos+1)+" of "+questions.length;
  if (rscore != 0) { $_("test_status").innerHTML += '<br>Currently: '+(correct/rscore*100).toFixed(0)+'% correct'; }
  var question = questions[posn][0];
  var chA = questions[posn][1];
  var chB = questions[posn][2];
  var chC = questions[posn][3];
  var chD = questions[posn][4];
  test.innerHTML = "<h3>"+question+"</h3>";
  test.innerHTML += "<label><input type='radio' name='choices' value='A'> "+chA+"</label><br>";
  test.innerHTML += "<label><input type='radio' name='choices' value='B'> "+chB+"</label><br>";
  test.innerHTML += "<label><input type='radio' name='choices' value='C'> "+chC+"</label><br>";
  test.innerHTML += "<label><input type='radio' name='choices' value='D'> "+chD+"</label><br><br>";
  test.innerHTML += "<button onclick='checkAnswer()'>Submit Answer</button>";
  timelimit = maxtimelimit;
  clearInterval(myVar);
  startTimer();
}

function checkAnswer(){
  var choices = document.getElementsByName("choices");
  for (var i=0; i<choices.length; i++) {
    if (choices[i].checked) { choice = choices[i].value; }
  }
  rscore++;
  if (choice == questions[posn][5] && timelimit > 0) { correct++; }
  pos++;  posn = questionOrder[pos];
  if (pos < questions.length) { renderQuestion(); } else { renderResults(); }
}

window.onload = function() {
  setQuestionOrder();
  renderQuestion();
}
</script>

</body>
</html> 
</center>
