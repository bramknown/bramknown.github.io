    <style>
      /*background*/
      body {
        background-image: url("images/background.jpg");
        background-repeat: no-repeat;
        background-size: 100vw 100vh;
      }

      /*pinguin animation*/
      .penguin {
        width: 50px;
        height: 72px;
        background-image: url("images/sprite-steps.png");
        -webkit-animation: play .8s steps(10);
           -moz-animation: play .8s steps(10);
            -ms-animation: play .8s steps(10);
             -o-animation: play .8s steps(10);
                animation: play .8s steps(10);
      }
      @-webkit-keyframes play {
        from {background-position: 0px;}
        to {background-position: -500px;}
      }
      @-moz-keyframes play {
        from {background-position: 0px;}
        to {background-position: -500px;}
      }
      @-ms-keyframes play {
        from {background-position: 0px;}
        to {background-position: -500px;}
      }
      @-o-keyframes play {
        from {background-position: 0px;}
        to {background-position: -500px;}
      }
      @keyframes play {
        from {background-position: 0px;}
        to {background-position: -500px;}
      }

      /*positions*/
      #bottom-right {
      	right: 0;
      	bottom: 0;
      	position: absolute;
      }
      #bottom-left {
      	left: 0;
      	bottom: 0;
      	position: absolute;
      }
      .container  {
      	position: relative;
        margin: auto;
        padding: 2%;
        height: 320px;
        width: 768px;
      }
      .header {
      	position: relative;
        border-color: blue;
        background-color: #2c5098;
        padding: 10px;
        text-align: center;
      }
      /*color*/
      .color {
        color: #e6ffe6;
      }

      /*Gallary*/
      div.gallery {
      	margin: 5px;
      	border: 1px solid #ccc;
      	float: left;
      	width: 180px;
      }
      div.gallery:hover {
      	border: 1px solid #777;
      }
      div.gallery img {
      	width: 100%;
      	height: auto;
      }
      div.desc {
      	padding: 15px;
      	text-align: center;
      	background-color:rgb(221, 229, 230);
      }

    </style>
